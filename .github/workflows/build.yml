name: Build offline bundle
on:
  push:
    branches: [main]
    paths:
      - patches/**
      - extensions/**
      - local_bridge.py
      - smoke-test.sh
      - Dockerfile
      - start-piermux.sh
      - README.md
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check launcher syntax
        run: bash -n start-piermux.sh && bash -n smoke-test.sh
      - uses: actions/cache/restore@v4
        id: image-cache
        with:
          path: .build-cache/piermux-image.tar
          key: runtime-v1-${{ runner.os }}-${{ hashFiles('Dockerfile', 'patches/**', 'extensions/**', 'local_bridge.py') }}
      - name: Load cached runtime
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i .build-cache/piermux-image.tar
      - name: Build Linux application and runtime
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: docker build --progress=plain -t piermux-offline .
      - name: Save runtime archive
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .build-cache
          docker save piermux-offline -o .build-cache/piermux-image.tar
      - uses: actions/cache/save@v4
        if: steps.image-cache.outputs.cache-hit != 'true'
        with:
          path: .build-cache/piermux-image.tar
          key: runtime-v1-${{ runner.os }}-${{ hashFiles('Dockerfile', 'patches/**', 'extensions/**', 'local_bridge.py') }}
      - name: Verify GUI under Xvfb
        timeout-minutes: 3
        run: |
          timeout --kill-after=10s 120s docker run --name piermux-smoke --network none --user nobody:nogroup --env HOME=/tmp/test-home --mount type=bind,src="$PWD/smoke-test.sh",dst=/smoke-test.sh,readonly --entrypoint /bin/bash piermux-offline -euxo pipefail -c '
            mkdir -p "$HOME"
            exec dbus-run-session -- xvfb-run -a bash /smoke-test.sh
          '
      - name: Collect GUI diagnostics
        if: always()
        run: |
          docker logs piermux-smoke 2>&1 || true
          docker inspect --format '{{json .State}}' piermux-smoke || true
          docker rm -f piermux-smoke || true
      - name: Export offline sandbox and package
        run: |
          set -euo pipefail
          mkdir -p staging/piermux-offline/rootfs dist
          container_id=$(docker create piermux-offline)
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker export "$container_id" -o rootfs.tar
          tar --no-same-owner --exclude='./dev/*' --exclude='dev/*' --exclude='./proc/*' --exclude='proc/*' --exclude='./sys/*' --exclude='sys/*' -xf rootfs.tar -C staging/piermux-offline/rootfs
          cp start-piermux.sh local_bridge.py README.md staging/piermux-offline/
          chmod +x staging/piermux-offline/start-piermux.sh
          tar -C staging -czf dist/piermux-offline-linux-x86_64.tar.gz piermux-offline
          cd dist
          sha256sum piermux-offline-linux-x86_64.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: piermux-offline-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30
