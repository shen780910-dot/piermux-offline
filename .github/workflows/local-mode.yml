name: Test local connection
on:
  push:
    paths:
      - local_bridge.py
      - extensions/test_local_bridge.py
      - .github/workflows/local-mode.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test local protocol and host PTY
        run: python3 -m unittest extensions.test_local_bridge -v
